# Hermes Agent configuration snippet for sag-agents-plugin — merge into the
# config.yaml of each profile (or the shared section if used by all profiles).
#
# Hermes has no "plugin" format like Claude Code — this plugin is consumed
# through two entry points: (1) a generic MCP client pointing at sag + sagw,
# (2) skills.external_dirs pointing at the same skills/ directory — a single
# source of truth, no forking, no drift (docs/SPEC.md §S0, §S8).

mcp_servers:
  sag:
    url: "${SAG_URL}/mcp/"
    headers:
      Authorization: "Bearer ${SAG_READ_TOKEN}"
    enabled: true
    connect_timeout: 60
    timeout: 120
    tools:
      resources: false
      prompts: false
      # allow-all — the server only has 8 read tools, no need for an include list

  sagw:
    command: "python"
    args: ["/opt/agent-skills/sag-agents-plugin/scripts/sagw_server.py"]
    env:
      SAGCTL_AGENT: "hermes:${HERMES_PROFILE_NAME}"
    enabled: true
    connect_timeout: 30
    timeout: 60
    # Do NOT set a default include here — each profile declares its own
    # include based on its role (see below). No include declared = no write
    # permissions at all.

skills:
  external_dirs:
    - /opt/agent-skills/sag-agents-plugin/skills
    # Mount READ-ONLY at the filesystem level for the account running Hermes —
    # Hermes has a skill_manage tool that could modify skills itself if the
    # directory is writable (the SPEC reiterates this risk from
    # AGENT-BEHAVIOR.md R6).

# --- Example role-based permission assignment (place inside the matching profile block) ------

profiles:
  product_researcher:
    mcp_servers:
      sagw:
        tools:
          include: [sag_publish, sag_publish_status, sag_sync_preview]
          # NO sag_reprocess/sag_publish_unreviewed/sag_unpublish —
          # a researcher only publishes, no remediation/reprocessing.

  developer:
    mcp_servers:
      sagw:
        tools:
          include: [sag_publish, sag_publish_status, sag_sync_preview, sag_reprocess]

  delivery_engineer:
    mcp_servers:
      sagw:
        tools:
          include: [sag_publish, sag_publish_status, sag_sync_preview, sag_reprocess, sag_unpublish]

  orchestrator:
    # The only role with batch sync, queue-review, and source-admin
    # permissions — these operations are NOT MCP tools (CLI-only per
    # SPEC S8); the permission is granted via env vars.
    mcp_servers:
      sagw:
        tools:
          include: [sag_publish, sag_publish_status, sag_sync_preview, sag_reprocess, sag_publish_unreviewed, sag_unpublish]
    env:
      SAGCTL_ALLOW_SYNC: "1"
      SAGCTL_ALLOW_QUEUE_REVIEW: "1"
      SAGCTL_AGENT: "hermes:orchestrator"

# Secrets (SAG_URL, SAG_READ_TOKEN, HERMES_PROFILE_NAME) go in each profile's
# .env file, NOT hard-coded in this file (Hermes supports ${VAR} and
# ${env:VAR} — see the Hermes MCP integration docs).
#
# The write token does NOT appear here — sagw reads it from
# ~/.sagctl/credentials.json on the machine running the sagw process (run
# `sagctl login` once on that machine).
